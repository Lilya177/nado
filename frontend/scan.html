<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NOIR VISION — AI Face Scan</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #050505;
  --bg-elevated: #111111;
  --bg-soft: #181818;
  --text: #f5f5f5;
  --text-muted: #9b9b9b;
  --accent: #ffffff;
  --border: #2a2a2a;
  font-size: 112%;
}
html { scroll-behavior: smooth; }
body {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
  background: radial-gradient(circle at top, #1e1e1e 0, #050505 55%);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 40px 20px 60px;
}

.scan-header {
  width: 100%; max-width: 760px;
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 32px;
}
.scan-logo {
  display: flex; align-items: center; gap: 9px;
  font-size: 14px; letter-spacing: .28em; text-transform: uppercase;
  text-decoration: none; color: var(--text);
}
.scan-logo-mark {
  width: 14px; height: 14px;
  border-radius: 4px 4px 4px 12px;
  border: 1.5px solid var(--accent);
}
.back-btn {
  font-size: 11px; letter-spacing: .16em; text-transform: uppercase;
  color: var(--text-muted); border: 1px solid var(--border);
  border-radius: 999px; padding: 7px 18px; cursor: pointer;
  background: transparent; font-family: inherit;
  transition: border-color .2s, color .2s;
}
.back-btn:hover { border-color: var(--accent); color: var(--accent); }

.card {
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: 24px; padding: 32px;
  width: 100%; max-width: 760px;
}
.card-eyebrow {
  font-size: 10px; letter-spacing: .28em; text-transform: uppercase;
  color: var(--text-muted); margin-bottom: 6px;
}
.card-heading {
  font-size: 22px; letter-spacing: .14em; text-transform: uppercase;
  font-weight: 300; margin-bottom: 28px;
}

.video-wrap {
  position: relative; width: 100%; aspect-ratio: 4/3;
  background: #000; border-radius: 16px; overflow: hidden;
  border: 1px solid var(--border); margin-bottom: 20px;
}
video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); display: block; }
.overlay { position: absolute; inset: 0; pointer-events: none; }

.face-oval {
  position: absolute; top: 50%; left: 50%;
  transform: translate(-50%, -58%);
  width: 210px; height: 270px;
  border: 2px solid rgba(255,255,255,.2);
  border-radius: 50%;
  transition: border-color .4s, box-shadow .4s;
}
.face-oval.ready   { border-color: rgba(255,255,255,.65); }
.face-oval.capture { border-color: #fff; box-shadow: 0 0 0 5px rgba(255,255,255,.12); }

.arrow-svg {
  position: absolute; inset: 0; width: 100%; height: 100%;
  opacity: 0; transition: opacity .4s;
}
.arrow-svg.visible { opacity: 1; }

.flash {
  position: absolute; inset: 0; background: #fff; opacity: 0;
  border-radius: 16px; pointer-events: none; transition: opacity .08s;
}
.flash.go { opacity: 0.55; }

.instruction-box {
  position: absolute; bottom: 16px; left: 50%;
  transform: translateX(-50%);
  background: rgba(5,5,5,.88);
  border: 1px solid var(--border);
  border-radius: 999px; padding: 8px 28px;
  white-space: nowrap; backdrop-filter: blur(10px);
}
.inst-step { font-size: 9px; color: var(--text-muted); letter-spacing: .22em; text-transform: uppercase; margin-bottom: 2px; text-align: center; }
.inst-text { font-size: 12px; color: var(--text); text-align: center; }

.dots { display: flex; justify-content: center; gap: 10px; margin-bottom: 16px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--border); transition: background .4s, transform .3s; }
.dot.done    { background: var(--text); }
.dot.current { background: var(--text); transform: scale(1.5); }

.bar-wrap { height: 2px; background: var(--border); border-radius: 2px; overflow: hidden; margin-bottom: 24px; }
.bar-fill  { height: 100%; width: 0%; background: var(--accent); transition: width .6s ease; }

.btn-row { display: flex; gap: 10px; justify-content: center; }
.btn {
  border-radius: 999px; border: 1px solid var(--border);
  padding: 10px 22px; font-size: 11px; letter-spacing: .18em;
  text-transform: uppercase; background: transparent;
  color: var(--text-muted); cursor: pointer; font-family: inherit;
  transition: border-color .2s, color .2s;
}
.btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.btn:disabled { opacity: .3; cursor: default; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: #000; font-weight: 600; }
.btn-primary:hover:not(:disabled) { background: #ddd; border-color: #ddd; }

.result-block {
  display: none; margin-top: 28px;
  background: var(--bg-soft); border: 1px solid var(--border);
  border-radius: 20px; padding: 26px;
}
.result-eyebrow { font-size: 9px; letter-spacing: .22em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 6px; }
.result-shape   { font-size: 28px; font-weight: 200; text-transform: uppercase; letter-spacing: .16em; margin-bottom: 4px; }
.result-conf    { font-size: 11px; color: var(--text-muted); margin-bottom: 16px; }
.conf-bar  { height: 2px; background: var(--border); border-radius: 2px; margin-bottom: 24px; }
.conf-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width 1s ease; width: 0%; }

.rec-label { font-size: 9px; color: var(--text-muted); letter-spacing: .2em; text-transform: uppercase; margin-bottom: 10px; }
.votes { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 20px; }
.vote-badge {
  font-size: 10px; padding: 4px 12px; border-radius: 999px;
  background: var(--bg-elevated); border: 1px solid var(--border); color: var(--text-muted);
}
.vote-badge.win { border-color: rgba(255,255,255,.22); color: var(--text); }

.frames-row { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin-bottom: 24px; }
.frames-row img { width: 100%; border-radius: 10px; border: 1px solid var(--border); }

.glasses-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 10px; }
.glass-card {
  background: var(--bg-elevated); border: 1px solid var(--border);
  border-radius: 14px; padding: 14px; text-align: center;
  transition: border-color .2s;
}
.glass-card:hover { border-color: rgba(255,255,255,.14); }
.glass-card .g-name  { color: var(--text); font-size: 12px; margin-top: 6px; }
.glass-card .g-price { color: var(--text-muted); font-size: 11px; margin-top: 4px; }

@media (max-width: 580px) {
  .card { padding: 20px 16px; }
  .glasses-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div class="scan-header">
  <a class="scan-logo" href="noir_vision_ready.html">
    <div class="scan-logo-mark"></div>
    NOIR VISION
  </a>
  <button class="back-btn" onclick="history.back()">← Назад</button>
</div>

<div class="card">
  <div class="card-eyebrow">Искусственный интеллект</div>
  <div class="card-heading">AI Face Scan</div>

  <div class="video-wrap" id="videoWrap">
    <video id="webcam" autoplay playsinline muted></video>
    <div class="overlay">
      <div class="face-oval" id="faceOval"></div>

      <!-- ПРЯМО -->
      <svg class="arrow-svg" id="arrowFront" viewBox="0 0 640 480" xmlns="http://www.w3.org/2000/svg">
        <circle cx="320" cy="100" r="4" fill="#fff" opacity="0.6"/>
        <circle cx="320" cy="380" r="4" fill="#fff" opacity="0.6"/>
        <circle cx="150" cy="240" r="4" fill="#fff" opacity="0.6"/>
        <circle cx="490" cy="240" r="4" fill="#fff" opacity="0.6"/>
        <text x="320" y="66" text-anchor="middle" fill="rgba(255,255,255,0.65)"
              font-size="11" font-family="SF Pro Text,system-ui" letter-spacing="3">ПРЯМО</text>
      </svg>

      <!-- ВЛЕВО -->
      <svg class="arrow-svg" id="arrowLeft" viewBox="0 0 640 480" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <marker id="ah-l" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M2 1L8 5L2 9" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
          </marker>
        </defs>
        <line x1="490" y1="240" x2="168" y2="240"
              stroke="rgba(255,255,255,0.75)" stroke-width="2" stroke-linecap="round" marker-end="url(#ah-l)"/>
        <path d="M380 160 Q240 200 240 240" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1" stroke-dasharray="5 4"/>
        <text x="320" y="66" text-anchor="middle" fill="rgba(255,255,255,0.65)"
              font-size="11" font-family="SF Pro Text,system-ui" letter-spacing="3">МЕДЛЕННО ВЛЕВО</text>
      </svg>

      <!-- ВПРАВО -->
      <svg class="arrow-svg" id="arrowRight" viewBox="0 0 640 480" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <marker id="ah-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M2 1L8 5L2 9" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
          </marker>
        </defs>
        <line x1="150" y1="240" x2="472" y2="240"
              stroke="rgba(255,255,255,0.75)" stroke-width="2" stroke-linecap="round" marker-end="url(#ah-r)"/>
        <path d="M260 160 Q400 200 400 240" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1" stroke-dasharray="5 4"/>
        <text x="320" y="66" text-anchor="middle" fill="rgba(255,255,255,0.65)"
              font-size="11" font-family="SF Pro Text,system-ui" letter-spacing="3">МЕДЛЕННО ВПРАВО</text>
      </svg>

      <div class="flash" id="flash"></div>

      <div class="instruction-box">
        <div class="inst-step" id="instrStep">AI FACE SCAN</div>
        <div class="inst-text"  id="instrText">Нажмите «Включить камеру»</div>
      </div>
    </div>
  </div>

  <div class="dots">
    <div class="dot" id="dot0"></div>
    <div class="dot" id="dot1"></div>
    <div class="dot" id="dot2"></div>
  </div>
  <div class="bar-wrap"><div class="bar-fill" id="barFill"></div></div>

  <div class="btn-row">
    <button class="btn" id="startBtn" onclick="startCamera()">Включить камеру</button>
    <button class="btn btn-primary" id="scanBtn" onclick="startScan()" disabled>Начать сканирование</button>
  </div>

  <div class="result-block" id="resultBlock">
    <div class="result-eyebrow">Результат анализа</div>
    <div class="result-shape" id="resShape">—</div>
    <div class="result-conf"  id="resConf">—</div>
    <div class="conf-bar"><div class="conf-fill" id="confFill"></div></div>
    <div class="rec-label">Голоса по ракурсам</div>
    <div class="votes" id="votesRow"></div>
    <div class="rec-label">Захваченные кадры</div>
    <div class="frames-row" id="framesRow"></div>
    <div class="rec-label" style="margin-top:20px">Рекомендуемые оправы</div>
    <div class="glasses-grid" id="glassesGrid"></div>
  </div>
</div>

<script>
const STAGES = [
  { step:"ШАГ 1 / 3", text:"Смотрите прямо в камеру",        voice:"Посмотрите прямо в камеру и не двигайтесь",          arrow:"arrowFront", hold:3500, name:"front" },
  { step:"ШАГ 2 / 3", text:"Медленно поверните голову влево", voice:"Теперь медленно поверните голову влево и остановитесь", arrow:"arrowLeft",  hold:4000, name:"left"  },
  { step:"ШАГ 3 / 3", text:"Медленно поверните голову вправо",voice:"Отлично. Теперь медленно поверните голову вправо",    arrow:"arrowRight", hold:4000, name:"right" }
];

let captures = [], scanning = false, stream = null;
const videoEl = document.getElementById("webcam");

function speak(t) {
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(t);
  u.lang = "ru-RU"; u.rate = 0.9;
  window.speechSynthesis.speak(u);
}
function setDot(idx) {
  for (let i = 0; i < 3; i++) {
    document.getElementById("dot"+i).className =
      "dot" + (i < idx ? " done" : i === idx ? " current" : "");
  }
}
function showArrow(id) {
  ["arrowFront","arrowLeft","arrowRight"].forEach(a =>
    document.getElementById(a).classList.remove("visible"));
  if (id) document.getElementById(id).classList.add("visible");
}
function setOval(st) {
  document.getElementById("faceOval").className = "face-oval" + (st ? " "+st : "");
}
function wait(ms) { return new Promise(r => setTimeout(r,ms)); }
async function flashCapture() {
  const f = document.getElementById("flash");
  f.classList.add("go"); await wait(120); f.classList.remove("go");
}
async function startCamera() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video:{width:640,height:480,facingMode:"user"}, audio:false });
    videoEl.srcObject = stream;
    await new Promise(r => { videoEl.onloadedmetadata = r; });
    videoEl.play();
    document.getElementById("startBtn").disabled = true;
    document.getElementById("scanBtn").disabled  = false;
    document.getElementById("instrStep").textContent = "КАМЕРА ГОТОВА";
    document.getElementById("instrText").textContent = "Нажмите «Начать»";
    setOval("ready");
    speak("Камера включена. Нажмите начать сканирование.");
  } catch(e) { alert("Не удалось получить доступ к камере: " + e.message); }
}
async function startScan() {
  if (scanning) return;
  scanning = true; captures = [];
  document.getElementById("scanBtn").disabled  = true;
  document.getElementById("resultBlock").style.display = "none";
  document.getElementById("barFill").style.width = "0%";
  document.getElementById("framesRow").innerHTML = "";

  for (let i = 0; i < STAGES.length; i++) {
    const s = STAGES[i];
    document.getElementById("instrStep").textContent = s.step;
    document.getElementById("instrText").textContent = s.text;
    setDot(i); showArrow(s.arrow); setOval("ready"); speak(s.voice);
    await wait(s.hold * 0.6);
    setOval("capture");
    document.getElementById("instrText").textContent = "Держите так...";
    await wait(s.hold * 0.4);
    await flashCapture();

    const cv = document.createElement("canvas");
    cv.width = videoEl.videoWidth || 640; cv.height = videoEl.videoHeight || 480;
    cv.getContext("2d").drawImage(videoEl, 0, 0);
    const blob    = await new Promise(r => cv.toBlob(r, "image/jpeg", 0.95));
    const dataUrl = cv.toDataURL("image/jpeg", 0.4);
    captures.push({ blob, dataUrl, name: s.name });

    const img = document.createElement("img");
    img.src = dataUrl; img.title = s.name;
    document.getElementById("framesRow").appendChild(img);
    document.getElementById("barFill").style.width = ((i+1)/STAGES.length*100)+"%";
    setDot(i+1); setOval(""); showArrow(null);
    if (i < STAGES.length-1) await wait(600);
  }

  document.getElementById("instrStep").textContent = "";
  document.getElementById("instrText").textContent = "Анализируем...";
  speak("Отлично. Анализируем данные.");
  await sendFrames();
  scanning = false;
}
async function sendFrames() {
  const fd = new FormData();
  fd.append("frame_front", captures[0].blob, "front.jpg");
  if (captures[1]) fd.append("frame_left",  captures[1].blob, "left.jpg");
  if (captures[2]) fd.append("frame_right", captures[2].blob, "right.jpg");
  try {
    const resp = await fetch("/ai/analyze-video", { method:"POST", body:fd });
    if (!resp.ok) throw new Error(await resp.text());
    showResult(await resp.json());
  } catch(e) {
    document.getElementById("instrText").textContent = "Ошибка: " + e.message;
    speak("Произошла ошибка. Попробуйте снова.");
  } finally {
    stopCamera();
    document.getElementById("startBtn").disabled = false;
    document.getElementById("scanBtn").disabled  = false;
    document.getElementById("startBtn").textContent = "Включить снова";
  }
}
function showResult(data) {
  document.getElementById("resultBlock").style.display = "block";
  const names = { oval:"Овальное", round:"Круглое", square:"Квадратное", rect:"Прямоугольное", heart:"Сердце", triangle:"Треугольное", diamond:"Ромб" };
  const raw   = data.face_shape || "—";
  const label = raw.split("-").map(p => names[p] || p).join(" / ");
  document.getElementById("resShape").textContent = label;
  const pct = Math.round((data.confidence || 0)*100);
  document.getElementById("resConf").textContent  = "Уверенность: " + pct + "%";
  setTimeout(() => { document.getElementById("confFill").style.width = pct+"%"; }, 100);

  const vRow = document.getElementById("votesRow");
  vRow.innerHTML = "";
  if (data.angle_votes) {
    const lbl = { front:"прямо", left:"влево", right:"вправо" };
    Object.entries(data.angle_votes).forEach(([k,v]) => {
      const b = document.createElement("span");
      b.className = "vote-badge" + (v===(data.face_shape_primary||data.face_shape) ? " win" : "");
      b.textContent = (lbl[k]||k) + ": " + (names[v]||v);
      vRow.appendChild(b);
    });
  }

  const gGrid = document.getElementById("glassesGrid");
  gGrid.innerHTML = "";
  if (data.frames && data.frames.length) {
    data.frames.forEach(f => {
      const c = document.createElement("div"); c.className = "glass-card";
      c.innerHTML = f.image_url
        ? `<img src="${f.image_url}" style="width:100%;border-radius:8px;margin-bottom:8px">`
        : `<div style="height:70px;background:var(--bg);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:22px;margin-bottom:8px">🕶️</div>`;
      c.innerHTML += `<div class="g-name">${f.name||"—"}</div>`;
      if (f.price) c.innerHTML += `<div class="g-price">${f.price} ₽</div>`;
      gGrid.appendChild(c);
    });
  } else if (data.recommended_shapes && data.recommended_shapes.length) {
    data.recommended_shapes.forEach(s => {
      const c = document.createElement("div"); c.className = "glass-card";
      c.innerHTML = `<div style="height:50px;background:var(--bg);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:22px;margin-bottom:8px">🕶️</div><div class="g-name">${s}</div>`;
      gGrid.appendChild(c);
    });
  }
  document.getElementById("instrText").textContent = "Готово!";
  speak("Анализ завершён. Ваша форма лица: " + label);
}
function stopCamera() {
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
}
window.onbeforeunload = stopCamera;
</script>
</body>
</html>
