<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NOIR VISION — AI Face Scan</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/scan.css">
</head>
<body style="display:flex;flex-direction:column;align-items:center;padding:40px 20px 60px;min-height:100vh;">

<div class="scan-header">
  <a class="scan-logo" href="noir_vision_ready.html">
    <div class="scan-logo-mark"></div>
    NOIR VISION
  </a>
  <button class="back-btn" onclick="history.back()">← Назад</button>
</div>

<div class="scan-card">
  <div class="scan-card-eyebrow">Искусственный интеллект</div>
  <div class="scan-card-heading">AI Face Scan</div>

  <div class="scan-video-wrap" id="videoWrap">
    <video id="webcam" autoplay playsinline muted></video>
    <div class="scan-overlay">
      <div class="scan-oval" id="faceOval"></div>

      <!-- ПРЯМО -->
      <svg class="scan-arrow-svg" id="arrowFront" viewBox="0 0 640 480" xmlns="http://www.w3.org/2000/svg">
        <circle cx="320" cy="100" r="4" fill="#fff" opacity="0.6"/>
        <circle cx="320" cy="380" r="4" fill="#fff" opacity="0.6"/>
        <circle cx="150" cy="240" r="4" fill="#fff" opacity="0.6"/>
        <circle cx="490" cy="240" r="4" fill="#fff" opacity="0.6"/>
        <text x="320" y="66" text-anchor="middle" fill="rgba(255,255,255,0.65)"
              font-size="11" font-family="SF Pro Text,system-ui" letter-spacing="3">ПРЯМО</text>
      </svg>

      <!-- ВЛЕВО -->
      <svg class="scan-arrow-svg" id="arrowLeft" viewBox="0 0 640 480" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <marker id="ah-l" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M2 1L8 5L2 9" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
          </marker>
        </defs>
        <line x1="490" y1="240" x2="168" y2="240"
              stroke="rgba(255,255,255,0.75)" stroke-width="2" stroke-linecap="round" marker-end="url(#ah-l)"/>
        <path d="M380 160 Q240 200 240 240" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1" stroke-dasharray="5 4"/>
        <text x="320" y="66" text-anchor="middle" fill="rgba(255,255,255,0.65)"
              font-size="11" font-family="SF Pro Text,system-ui" letter-spacing="3">МЕДЛЕННО ВЛЕВО</text>
      </svg>

      <!-- ВПРАВО -->
      <svg class="scan-arrow-svg" id="arrowRight" viewBox="0 0 640 480" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <marker id="ah-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M2 1L8 5L2 9" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
          </marker>
        </defs>
        <line x1="150" y1="240" x2="472" y2="240"
              stroke="rgba(255,255,255,0.75)" stroke-width="2" stroke-linecap="round" marker-end="url(#ah-r)"/>
        <path d="M260 160 Q400 200 400 240" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1" stroke-dasharray="5 4"/>
        <text x="320" y="66" text-anchor="middle" fill="rgba(255,255,255,0.65)"
              font-size="11" font-family="SF Pro Text,system-ui" letter-spacing="3">МЕДЛЕННО ВПРАВО</text>
      </svg>

      <div class="scan-flash" id="flash"></div>

      <div class="scan-instruction-box">
        <div class="scan-instruction-step" id="instrStep">AI FACE SCAN</div>
        <div class="scan-instruction-text"  id="instrText">Нажмите «Включить камеру»</div>
      </div>
    </div>
  </div>

  <div class="scan-dots">
    <div class="scan-dot" id="dot0"></div>
    <div class="scan-dot" id="dot1"></div>
    <div class="scan-dot" id="dot2"></div>
  </div>
  <div class="scan-bar-wrap"><div class="scan-bar-fill" id="barFill"></div></div>

  <div class="scan-btn-row">
    <button class="btn" id="startBtn" onclick="startCamera()">Включить камеру</button>
    <button class="btn btn-primary" id="scanBtn" onclick="startScan()" disabled>Начать сканирование</button>
  </div>

  <div class="scan-result-block" id="resultBlock">
    <div class="scan-result-eyebrow">Результат анализа</div>
    <div class="scan-result-shape" id="resShape">—</div>
    <div class="scan-result-conf"  id="resConf">—</div>
    <div class="scan-conf-bar"><div class="scan-conf-fill" id="confFill"></div></div>
    <div class="scan-rec-label">Голоса по ракурсам</div>
    <div class="scan-votes" id="votesRow"></div>
    <div class="scan-rec-label">Захваченные кадры</div>
    <div class="scan-frames-grid" id="framesRow"></div>
    <div class="scan-rec-label scan-rec-label-margin">Рекомендуемые оправы</div>
    <div class="scan-glasses-grid" id="glassesGrid"></div>
  </div>
</div>

<script>
const STAGES = [
  { step:"ШАГ 1 / 3", text:"Смотрите прямо в камеру",        voice:"Посмотрите прямо в камеру и не двигайтесь",          arrow:"arrowFront", hold:3500, name:"front" },
  { step:"ШАГ 2 / 3", text:"Медленно поверните голову влево", voice:"Теперь медленно поверните голову влево и остановитесь", arrow:"arrowLeft",  hold:4000, name:"left"  },
  { step:"ШАГ 3 / 3", text:"Медленно поверните голову вправо",voice:"Отлично. Теперь медленно поверните голову вправо",    arrow:"arrowRight", hold:4000, name:"right" }
];

let captures = [], scanning = false, stream = null;
const videoEl = document.getElementById("webcam");

function speak(t) {
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(t);
  u.lang = "ru-RU"; u.rate = 0.9;
  window.speechSynthesis.speak(u);
}
function setDot(idx) {
  for (let i = 0; i < 3; i++) {
    document.getElementById("dot"+i).className =
      "scan-dot" + (i < idx ? " done" : i === idx ? " current" : "");
  }
}
function showArrow(id) {
  ["arrowFront","arrowLeft","arrowRight"].forEach(a =>
    document.getElementById(a).classList.remove("visible"));
  if (id) document.getElementById(id).classList.add("visible");
}
function setOval(st) {
  document.getElementById("faceOval").className = "scan-oval" + (st ? " "+st : "");
}
function wait(ms) { return new Promise(r => setTimeout(r,ms)); }
async function flashCapture() {
  const f = document.getElementById("flash");
  f.classList.add("go"); await wait(120); f.classList.remove("go");
}
async function startCamera() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video:{width:640,height:480,facingMode:"user"}, audio:false });
    videoEl.srcObject = stream;
    await new Promise(r => { videoEl.onloadedmetadata = r; });
    videoEl.play();
    document.getElementById("startBtn").disabled = true;
    document.getElementById("scanBtn").disabled  = false;
    document.getElementById("instrStep").textContent = "КАМЕРА ГОТОВА";
    document.getElementById("instrText").textContent = "Нажмите «Начать»";
    setOval("ready");
    speak("Камера включена. Нажмите начать сканирование.");
  } catch(e) { alert("Не удалось получить доступ к камере: " + e.message); }
}
async function startScan() {
  if (scanning) return;
  scanning = true; captures = [];
  document.getElementById("scanBtn").disabled  = true;
  document.getElementById("resultBlock").style.display = "none";
  document.getElementById("barFill").style.width = "0%";
  document.getElementById("framesRow").innerHTML = "";

  for (let i = 0; i < STAGES.length; i++) {
    const s = STAGES[i];
    document.getElementById("instrStep").textContent = s.step;
    document.getElementById("instrText").textContent = s.text;
    setDot(i); showArrow(s.arrow); setOval("ready"); speak(s.voice);
    await wait(s.hold * 0.6);
    setOval("capture");
    document.getElementById("instrText").textContent = "Держите так...";
    await wait(s.hold * 0.4);
    await flashCapture();

    const cv = document.createElement("canvas");
    cv.width = videoEl.videoWidth || 640; cv.height = videoEl.videoHeight || 480;
    cv.getContext("2d").drawImage(videoEl, 0, 0);
    const blob    = await new Promise(r => cv.toBlob(r, "image/jpeg", 0.95));
    const dataUrl = cv.toDataURL("image/jpeg", 0.4);
    captures.push({ blob, dataUrl, name: s.name });

    const img = document.createElement("img");
    img.src = dataUrl; img.title = s.name;
    document.getElementById("framesRow").appendChild(img);
    document.getElementById("barFill").style.width = ((i+1)/STAGES.length*100)+"%";
    setDot(i+1); setOval(""); showArrow(null);
    if (i < STAGES.length-1) await wait(600);
  }

  document.getElementById("instrStep").textContent = "";
  document.getElementById("instrText").textContent = "Анализируем...";
  speak("Отлично. Анализируем данные.");
  await sendFrames();
  scanning = false;
}
async function sendFrames() {
  const fd = new FormData();
  fd.append("frame_front", captures[0].blob, "front.jpg");
  if (captures[1]) fd.append("frame_left",  captures[1].blob, "left.jpg");
  if (captures[2]) fd.append("frame_right", captures[2].blob, "right.jpg");
  try {
    const resp = await fetch("/ai/analyze-video", { method:"POST", body:fd });
    if (!resp.ok) throw new Error(await resp.text());
    showResult(await resp.json());
  } catch(e) {
    document.getElementById("instrText").textContent = "Ошибка: " + e.message;
    speak("Произошла ошибка. Попробуйте снова.");
  } finally {
    stopCamera();
    document.getElementById("startBtn").disabled = false;
    document.getElementById("scanBtn").disabled  = false;
    document.getElementById("startBtn").textContent = "Включить снова";
  }
}
function showResult(data) {
  document.getElementById("resultBlock").style.display = "block";
  const names = { oval:"Овальное", round:"Круглое", square:"Квадратное", rect:"Прямоугольное", heart:"Сердце", triangle:"Треугольное", diamond:"Ромб" };
  const raw   = data.face_shape || "—";
  const label = raw.split("-").map(p => names[p] || p).join(" / ");
  document.getElementById("resShape").textContent = label;
  const pct = Math.round((data.confidence || 0)*100);
  document.getElementById("resConf").textContent  = "Уверенность: " + pct + "%";
  setTimeout(() => { document.getElementById("confFill").style.width = pct+"%"; }, 100);

  const vRow = document.getElementById("votesRow");
  vRow.innerHTML = "";
  if (data.angle_votes) {
    const lbl = { front:"прямо", left:"влево", right:"вправо" };
    Object.entries(data.angle_votes).forEach(([k,v]) => {
      const b = document.createElement("span");
      b.className = "vote-badge" + (v===(data.face_shape_primary||data.face_shape) ? " win" : "");
      b.textContent = (lbl[k]||k) + ": " + (names[v]||v);
      vRow.appendChild(b);
    });
  }

  const gGrid = document.getElementById("glassesGrid");
  gGrid.innerHTML = "";
  if (data.frames && data.frames.length) {
    data.frames.forEach(f => {
      const c = document.createElement("div"); c.className = "scan-glass-card";
      c.innerHTML = f.image_url
        ? `<div class="scan-glass-img"><img src="${f.image_url}"></div>`
        : `<div class="scan-glass-img">🕶️</div>`;
      c.innerHTML += `<div class="scan-glass-name">${f.title || f.name || "—"}</div>`;
      if (f.price) c.innerHTML += `<div class="scan-glass-price">${f.price} ₽</div>`;
      gGrid.appendChild(c);
    });
  } else if (data.recommended_shapes && data.recommended_shapes.length) {
    data.recommended_shapes.forEach(s => {
      const c = document.createElement("div"); c.className = "scan-glass-card";
      c.innerHTML = `<div class="scan-glass-img" style="height:50px;">🕶️</div><div class="scan-glass-name">${s}</div>`;
      gGrid.appendChild(c);
    });
  }
  document.getElementById("instrText").textContent = "Готово!";
  speak("Анализ завершён. Ваша форма лица: " + label);
}
function stopCamera() {
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
}
window.onbeforeunload = stopCamera;
</script>
</body>
</html>
